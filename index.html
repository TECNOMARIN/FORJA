<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OCR con Gemini 2.5 Pro</title>
</head>
<body>
  <h2>Subir una imagen para extraer texto con Gemini 2.5 Pro</h2>
  
  <input type="file" id="fileInput" accept="image/*">
  <button onclick="extraerTexto()">Extraer texto</button>
  
  <h3>Texto detectado:</h3>
  <pre id="resultado"></pre>

  <script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    // ⚠️ Reemplaza con tu API key (ya restringida a tecnomarin.github.io/*)
    const API_KEY = "TU_API_KEY_AQUI";

    const genAI = new GoogleGenerativeAI(API_KEY);
    const model = genAI.getGenerativeModel({ model: "gemini-2.5-pro" });

    async function extraerTexto() {
      const fileInput = document.getElementById("fileInput");
      if (!fileInput.files.length) {
        alert("Selecciona una imagen primero");
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async () => {
        const base64 = reader.result.split(",")[1]; // quitar encabezado data:

        try {
          const result = await model.generateContent([
            { text: "Extrae todo el texto exactamente como aparece en esta imagen." },
            {
              inlineData: {
                mimeType: file.type,
                data: base64
              }
            }
          ]);

          document.getElementById("resultado").textContent =
            result.response.text();
        } catch (err) {
          document.getElementById("resultado").textContent =
            "Error: " + err.message;
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
