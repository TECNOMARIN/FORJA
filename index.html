<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OCR con Gemini</title>
</head>
<body>
  <h2>Subir imagen para extraer texto</h2>
  <input type="file" id="fileInput" accept="image/*">
  <button onclick="extraerTexto()">Extraer Texto</button>

  <pre id="resultado"></pre>

  <script>
    const API_KEY = "AIzaSyDtnUCAh8bo8t9xBeTjnqxYBsZ4f03XEsw"; // Pon aquí tu API Key

    async function extraerTexto() {
      const fileInput = document.getElementById("fileInput");
      if (!fileInput.files[0]) {
        alert("Primero selecciona una imagen");
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onloadend = async () => {
        const base64Image = reader.result.split(",")[1]; 

        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "Extrae todo el texto de esta imagen:" },
                { inlineData: { mimeType: file.type, data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();
        console.log(data);

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          document.getElementById("resultado").innerText = data.candidates[0].content.parts[0].text;
        } else {
          document.getElementById("resultado").innerText = "No se pudo extraer texto.";
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
